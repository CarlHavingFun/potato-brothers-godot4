; RELEASE_POLICY=STAGING_ONLY
; Shipping builds must use tools/build_release.ps1. These presets deliberately
; target only the current formal presentation skin and are not a standalone publish path.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="release_staging_only"
export_filter="all_resources"
include_filter="content_packs/skins/lets_gooooo/asset_manifest.json"
exclude_filter="addons/*,assets/sprites/BG.png,assets/sprites/BG.png.import,assets/sprites/Gold/*,assets/sprites/Map.png,assets/sprites/Map.png.import,assets/sprites/Projectiles/*,assets/sprites/Spawn_mark.png,assets/sprites/Spawn_mark.png.import,assets/sprites/Upgrades/*,assets/sprites/Weapons/Icons/*,assets/sprites/Weapons/Melee/*,assets/sprites/Weapons/Range/*,assets/ui/*,bin/*,builds/*,content_packs/default/*,content_packs/skins/dev_placeholder/*,content_packs/skins/test_alt/*,dist/*,docs/*,icon.svg,icon.svg.import,reports/*,test_reports/*,tests/*,tools/*,vscode/*,.github/*"
export_path="builds/core/windows/GamePrototype.exe"
script_export_mode=2

[preset.0.options]

application/icon="res://content_packs/skins/lets_gooooo/assets/ui/app_icon.png"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false


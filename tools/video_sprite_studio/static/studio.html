<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频精灵工作台 / Video Sprite Studio</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#182236;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{height:58px;background:#152238;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}header h1{font-size:18px;margin:0}button{border:1px solid #c9d3e4;background:white;border-radius:7px;padding:8px 13px;cursor:pointer;color:#182236}button.primary{background:#1769e0;border-color:#1769e0;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}main{max-width:1180px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}.card{background:white;border:1px solid #dce3ee;border-radius:12px;padding:18px;box-shadow:0 2px 8px #20385b0d}.card h2{margin:0 0 14px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}label{font-size:12px;color:#58677c}input,select{border:1px solid #c9d3e4;border-radius:6px;padding:8px;width:100%;background:#fff}.actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.muted{color:#6d798a;font-size:12px}.status{padding:9px;border-radius:6px;background:#eef4ff;margin-top:10px;white-space:pre-wrap}.error{background:#fff0f0;color:#9a2525}.rows{display:flex;flex-direction:column;gap:8px}.row{border:1px solid #dde4ef;border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.row strong,.row small{display:block}.pill{font-size:11px;padding:3px 7px;border-radius:12px;background:#e9eef7}.pill.ready{background:#dff6e6;color:#13723a}.pill.failed{background:#ffe3e3;color:#a42323}#language{background:#243653;color:#fff;border-color:#4e6384}.deps{display:flex;gap:7px;flex-wrap:wrap}.dep{font-size:11px;padding:4px 7px;border-radius:4px;background:#e2f4e8}.dep.missing{background:#ffe2e2;color:#9b2525}@media(max-width:760px){main{grid-template-columns:1fr}.wide{grid-column:auto}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><h1 data-cn="视频精灵工作台" data-en="Video Sprite Studio">视频精灵工作台</h1><button id="language">EN</button></header>
<main>
  <section class="card wide"><h2 data-cn="环境" data-en="Environment">环境</h2><div class="actions"><input id="workspace-path" placeholder="外部工作区"><button id="change-workspace" data-cn="切换工作区" data-en="Switch workspace">切换工作区</button></div><div id="dependencies" class="deps"></div></section>
  <section class="card">
    <h2 data-cn="1. 新建角色 / 对象" data-en="1. New subject">1. 新建角色 / 对象</h2>
    <form id="profile-form" class="grid">
      <div class="field"><label data-cn="显示名称" data-en="Display name">显示名称</label><input name="display_name" required placeholder="Niko / 火球"></div>
      <div class="field"><label>subject_id</label><input name="subject_id" required pattern="[a-z0-9_]+" placeholder="niko"></div>
      <div class="field"><label data-cn="类型" data-en="Type">类型</label><select name="subject_type"><option value="character">角色 256 / 64 / (128,232)</option><option value="object">对象 256 / 128 / center</option><option value="effect">特效 256 / 128 / center</option></select></div>
      <div class="field"><label data-cn="造型基准图（必需）" data-en="Identity reference (required)">造型基准图（必需）</label><input name="base_image" type="file" accept="image/*" required></div>
      <details class="wide"><summary data-cn="高级尺寸与锚点" data-en="Advanced size and anchor">高级尺寸与锚点</summary><div class="grid"><input name="logical_size" type="number" min="8" max="232" placeholder="logical size"><input name="anchor_x" type="number" min="0" max="255" placeholder="anchor x"><input name="anchor_y" type="number" min="0" max="255" placeholder="anchor y"></div></details>
      <div class="actions wide"><button class="primary" data-cn="保存主体" data-en="Save subject">保存主体</button></div>
    </form><div id="profiles" class="rows"></div>
  </section>
  <section class="card">
    <h2 data-cn="2. 上传视频并解出全部帧" data-en="2. Upload video, process every frame">2. 上传视频并解出全部帧</h2>
    <form id="video-form" class="grid"><div class="field"><label data-cn="主体" data-en="Subject">主体</label><select name="profile_id" id="video-profile" required></select></div><div class="field"><label data-cn="动画名" data-en="Animation">动画名</label><input name="animation" required value="walk_down" pattern="[a-z0-9_]+"></div><div class="field wide"><label data-cn="视频" data-en="Video">视频</label><input name="video" type="file" accept=".mp4,.mov,.mkv,.webm,.avi" required></div><div class="actions wide"><button class="primary" data-cn="上传并开始" data-en="Upload and start">上传并开始</button><span class="muted" data-cn="原视频与全部候选帧保存在项目外。" data-en="Video and all candidate frames stay outside the project.">原视频与全部候选帧保存在项目外。</span></div></form>
  </section>
  <section class="card wide"><h2 data-cn="3. 任务与挑帧" data-en="3. Jobs and curation">3. 任务与挑帧</h2><div id="jobs" class="rows"></div><div class="muted" data-cn="打开挑帧后可用 Ctrl / Shift 多选、批量添加、重复和拖动排序。" data-en="Open curation to use Ctrl/Shift multi-select, batch add, duplicates, and drag ordering.">打开挑帧后可用 Ctrl / Shift 多选、批量添加、重复和拖动排序。</div></section>
  <section class="card wide" id="export">
    <h2 data-cn="4. 导出到 Godot" data-en="4. Export to Godot">4. 导出到 Godot</h2>
    <div class="grid"><div class="field wide"><label data-cn="Godot 4 项目绝对路径" data-en="Godot 4 project absolute path">Godot 4 项目绝对路径</label><div class="actions"><input id="project-root" list="recent-projects" placeholder="E:\\game"><button id="browse-project" data-cn="浏览目录" data-en="Browse folders">浏览目录</button></div><datalist id="recent-projects"></datalist></div><div class="field wide"><label data-cn="总 SpriteFrames 资源" data-en="Aggregate SpriteFrames resource">总 SpriteFrames 资源</label><input id="target-resource" list="sprite-resources" placeholder="留空使用主体默认路径"><datalist id="sprite-resources"></datalist></div><div class="field"><label data-cn="动画名" data-en="Animation">动画名</label><input id="export-animation" value="walk_down" pattern="[a-z0-9_]+"></div><div class="field"><label>FPS</label><input id="export-fps" type="number" min="0.1" max="120" step="0.1" value="10"></div><div class="field"><label>Loop</label><input id="export-loop" type="checkbox" checked></div></div>
    <div class="actions"><button id="validate-project" data-cn="检查项目" data-en="Validate project">检查项目</button><button id="preview-export" class="primary" data-cn="预览差异" data-en="Preview changes">预览差异</button><button id="confirm-export" disabled data-cn="确认生成并注册" data-en="Confirm export">确认生成并注册</button></div><div id="export-status" class="status" hidden></div>
    <p class="muted" data-cn="只更新总 SpriteFrames 中的这个动画；不会修改 .tscn、AnimatedSprite2D、首选 take 或 runtime。" data-en="Only this animation is changed. Scenes, AnimatedSprite2D nodes, preferred takes, and runtime are untouched.">只更新总 SpriteFrames 中的这个动画；不会修改 .tscn、AnimatedSprite2D、首选 take 或 runtime。</p>
  </section>
</main>
<script>
let state={},preview=null,refreshTimer=null,lang=document.documentElement.lang==='en'?'en':'cn';const token=window.VIDEO_SPRITE_STUDIO_TOKEN,t=(cn,en)=>lang==='en'?en:cn;
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-cn]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelector('#language').textContent=lang==='cn'?'EN':'中文'}
async function api(path,options={}){options.headers={...(options.headers||{}),'X-Studio-Token':token};const response=await fetch(path,options),data=await response.json();if(!response.ok)throw new Error(data.error||response.statusText);return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){state=await fetch('/api/studio/state').then(r=>r.json());if(document.activeElement!==document.querySelector('#workspace-path'))document.querySelector('#workspace-path').value=state.workspace;document.querySelector('#dependencies').innerHTML=Object.entries(state.dependencies).map(([k,v])=>`<span class="dep ${v?'':'missing'}">${k}: ${esc(v||t('缺失','missing'))}</span>`).join('');document.querySelector('#profiles').innerHTML=state.profiles.map(p=>`<div class="row"><span><strong>${esc(p.display_name)}</strong><small>${esc(p.subject_id)} · ${esc(p.subject_type)}</small></span><span class="pill">${p.logical_size}px · (${p.anchor.join(',')})</span></div>`).join('');document.querySelector('#video-profile').innerHTML=state.profiles.map(p=>`<option value="${p.subject_id}">${esc(p.display_name)} (${p.subject_id})</option>`).join('');document.querySelector('#jobs').innerHTML=state.jobs.map(j=>`<div class="row"><span><strong>${esc(j.profile_id)} / ${esc(j.animation)}</strong><small>${esc(j.job_id)} · ${esc(j.frame_count||'--')}f ${j.error?'<br>'+esc(j.error):''}</small></span><span><span class="pill ${j.state}">${esc(j.state)}</span> ${j.state==='ready'?`<button onclick="openJob('${j.job_id}')">${t('打开挑帧','Curate')}</button>`:''}${['running','queued','cancelling'].includes(j.state)?`<button onclick="cancelJob('${j.job_id}')">${t('取消','Cancel')}</button>`:''}</span></div>`).join('')||t('暂无任务','No jobs');document.querySelector('#recent-projects').innerHTML=state.projects.map(p=>`<option value="${esc(p.project_root)}">`).join('');if(state.active_job_id){const j=state.jobs.find(v=>v.job_id===state.active_job_id);if(j){document.querySelector('#export-animation').value=j.animation;if(document.querySelector('#export-fps').dataset.job!==j.job_id){document.querySelector('#export-fps').value=j.curation_fps||10;document.querySelector('#export-loop').checked=j.curation_loop!==false;document.querySelector('#export-fps').dataset.job=j.job_id}}}clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,2000)}
async function openJob(id){await api('/api/studio/job/open',{method:'POST',body:JSON.stringify({job_id:id})});location.href='/?lang='+lang}async function cancelJob(id){await api('/api/studio/job/cancel',{method:'POST',body:JSON.stringify({job_id:id})});refresh()}
document.querySelector('#language').onclick=()=>{lang=lang==='cn'?'en':'cn';history.replaceState(null,'','?lang='+lang+location.hash);translate()};document.querySelector('#profile-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/studio/profile/create',{method:'POST',body:new FormData(e.target)});e.target.reset();await refresh()}catch(err){alert(err.message)}};document.querySelector('#video-form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api('/api/studio/video/upload',{method:'POST',body:new FormData(e.target)});await refresh()}catch(err){alert(err.message)}finally{b.disabled=false}};
document.querySelector('#change-workspace').onclick=async()=>{if(!confirm(t('切换后将显示新工作区中的主体和任务。','The studio will switch to profiles and jobs in the new workspace.')))return;try{await api('/api/studio/workspace/change',{method:'POST',body:JSON.stringify({workspace:document.querySelector('#workspace-path').value})});await refresh()}catch(e){alert(e.message)}};
document.querySelector('#browse-project').onclick=async()=>{try{const start=document.querySelector('#project-root').value||state.projects[0]?.project_root||'C:\\';const result=await fetch('/api/studio/browse?path='+encodeURIComponent(start)).then(r=>r.json());if(result.error)throw new Error(result.error);const answer=prompt(t('输入序号进入目录，或粘贴完整项目路径：\n','Enter a number to enter a directory, or paste the full project path:\n')+['0: ..',...result.directories.map((v,i)=>`${i+1}: ${v}`)].join('\n'),result.path);if(answer===null)return;const n=Number(answer);document.querySelector('#project-root').value=Number.isInteger(n)&&String(n)===answer.trim()?(n===0?result.parent:result.directories[n-1]):answer}catch(e){alert(e.message)}};
async function project(){const p=await api('/api/studio/project/validate',{method:'POST',body:JSON.stringify({project_root:document.querySelector('#project-root').value})});document.querySelector('#sprite-resources').innerHTML=p.sprite_frames.map(v=>`<option value="${esc(v)}">`).join('');const j=state.jobs.find(v=>v.job_id===state.active_job_id);if(j&&p.bindings?.[j.profile_id]&&!document.querySelector('#target-resource').value)document.querySelector('#target-resource').value=p.bindings[j.profile_id];return p}document.querySelector('#validate-project').onclick=async()=>{try{const p=await project();show(t('有效 Godot 4 项目；发现 ','Valid Godot 4 project; found ')+p.sprite_frames.length+t(' 个 SpriteFrames。',' SpriteFrames.'))}catch(e){show(e.message,true)}};
function payload(){return{job_id:state.active_job_id,project_root:document.querySelector('#project-root').value,target_resource:document.querySelector('#target-resource').value,animation:document.querySelector('#export-animation').value,fps:Number(document.querySelector('#export-fps').value),loop:document.querySelector('#export-loop').checked}}function show(message,error=false){const box=document.querySelector('#export-status');box.hidden=false;box.className='status'+(error?' error':'');box.textContent=message}
document.querySelector('#preview-export').onclick=async()=>{try{preview=await api('/api/studio/export/preview',{method:'POST',body:JSON.stringify(payload())});show(`${preview.message}\n${preview.frame_count} frames · ${preview.fps} FPS · Loop=${preview.loop}\n${preview.target_resource}`);document.querySelector('#confirm-export').disabled=false}catch(e){preview=null;document.querySelector('#confirm-export').disabled=true;show(e.message,true)}};document.querySelector('#confirm-export').onclick=async()=>{if(!preview)return;const b=document.querySelector('#confirm-export');b.disabled=true;try{const r=await api('/api/studio/export/confirm',{method:'POST',body:JSON.stringify({...payload(),confirmation_token:preview.confirmation_token})});show(t('导出成功\n','Export succeeded\n')+`${r.target_resource}\n${r.animation}: ${r.frame_count} frames\n${r.atlas_resource}`);preview=null}catch(e){show(e.message,true)}finally{b.disabled=false}};translate();refresh();
</script>
</body></html>
